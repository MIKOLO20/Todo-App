<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
.parent{
display: grid;
grid-template-columns: repeat(5,1fr);grid-template-rows: repeat(10);
gap: 10px;
cursor: pointer;
  } 
  .num{
    border: 1px solid lightblue;border-radius: 5px;
    display: flex; justify-content: center; align-items: center;
    width: 80px; height: 50px;
    background-color: lightblue;
  }
</style>
<body>
    <div class="border border-success col-lg-4 col-md-4 col-sm-4 mx-auto text-success rounded px-3 py-4 mt-5">
  <form action="">
     <div class="fw-bold fs-4">
        <label for="">First Name</label>
        <input class="border border-success form-control" type="text" placeholder="Enter your first name" id="firstname">
     </div>
      <div class="fw-bold fs-4">
        <label for="">last Name</label>
        <input class="border border-success form-control" type="text" placeholder="Enter your last name" id="lastname">
     </div>
      <div>
        <label for="">Date</label>
        <input class="border border-success form-control" type="date" name="" id="date">
      </div>
      <div class="fw-bold fs-4">
        <label for="">Seat No</label>
        <input class="border border-success form-control" type="text" placeholder="1-50" id="seat">
     </div>
     <button onclick="BookTicket()" type="submit" id="book" class="border border-success form-control mt-3">Submit</button>
     <button onclick="ChangeTicket()" id="change" type="submit" class="border border-success form-control mt-3">Change</button>
  </form>
    </div>
    <div class="text-center mt-3 text-success ">
        <h1>Available Tickets</h1>
        <div id="tickets" class="parent text-success fw-bold mt-4 col-lg-4 col-md-4 col-sm-4 mx-auto"></div>
    </div>
    <div>
        <div class="col-lg-4 col-md-4 col-sm-4 mx-auto">
          <table class="table border border-secondary col-lg-4 col-md-4 col-sm-4 mt-3 px-4 py-4">
            <thead>
              <th>S/N</th>
              <th>First name</th>
              <th>Last name</th>
              <th>Date</th>
              <th>Seat No</th>
              <th>Edit</th>
              <th>Cancel</th>
            </thead>
            <tbody id="display"></tbody>
          </table>
        </div>

        <script src="./Ticket.js"></script>
</body>
</html>
