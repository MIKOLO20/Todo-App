<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    .parent{
        display: grid;
        grid-template-columns: repeat(4,1fr);
        grid-template-rows: repeat(5, 100px);
        gap: 10px;
        margin-top: 30px;
        cursor: pointer;
    }
    .keys{
        border: 1px solid lightgray;
        display: flex;justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: 600;
    }
    .equal{
        grid-row: span 2;
    }
    .zero{
        grid-column: span 2;
    }
</style>

<body>
    <div class="container mt-5">
        <div class="container border border-primary col-sm-6 col-md-8 col-lg-8 p-2 rounded">
            <div style="height: 100px;" class="container border bg-warning p-2 mt-2">
                <div id="calc" class="text-light fw-medium fs-3"></div>
                <div id="result" class="text-light fw-bold fs-3 text-end"></div>
              </div>
              <div onclick="" class="parent">
               <div  onclick="clearOne()"  class="keys">C</div>
               <div  onclick="clearAll()"  class="keys">CE</div>
                <div  onclick="calculator('/')"  class="keys">/</div>
                 <div  onclick="calculator('*')"  class="keys">*</div>
                  <div  onclick="calculator(7)"  class="keys">7</div>
                   <div  onclick="calculator(8)"  class="keys">8</div>
                    <div  onclick="calculator(9)"  class="keys">9</div>
                     <div  onclick="calculator('-')"  class="keys">-</div>
                      <div  onclick="calculator(4)"  class="keys">4</div>
                       <div  onclick="calculator(5)"  class="keys">5</div>
                        <div  onclick="calculator(6)"  class="keys">6</div>
                         <div  onclick="calculator('+')"  class="keys">+</div>
                          <div  onclick="calculator(1)"  class="keys">1</div>
                           <div  onclick="calculator(2)"  class="keys">2</div>
                            <div  onclick="calculator(3)"  class="keys">3</div>
                             <div  onclick="showResult()"  class="keys equal">=</div>
                              <div  onclick="calculator(0)"  class="keys zero">0</div>
                               <div  onclick="calculator('.')"  class="keys">.</div>
              </div>
            </div>
            
          </div>
    



    <script src="./calculator.js"></script>
</body>
</html>
