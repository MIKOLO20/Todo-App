    <input type="password" name="" id="password"><span id="eye"><i class="fa-solid fa-eye-slash" id="eyeclosed" onclick="showpassword()"></i></span>

        const showpassword = () =>{
            document.getElementById("eye").innerHTML = `<i class="fa-solid fa-eye" onclick="hidepassword()"></i>`;
            document.getElementById("password").type = "text";
        }
        const hidepassword = ()=>{
             document.getElementById("eye").innerHTML = `<i class="fa-solid fa-eye-slash" id="eyeClosed" onclick="showpassword()"></i>`;

        }
