<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class=" col-lg-4 col-md-6 col-sm-6 mx-auto text-success rounded px-3 py-4 shadow-lg mt-5">
        <form action="">
            <div class="fw-bold fs-4">
                <label for="">First Name:</label>
                <input id="name" class="form-control border-success text-success" type="text" placeholder="Enter first Name">
            </div>
             <div class="fw-bold fs-4">
                <label for="">Last Name:</label>
                <input id="last" class="form-control border-success text-success" type="text" placeholder="Enter last Name">
            </div>
             <div class="fw-bold fs-4">
                <label for="">Date:</label>
               <input id="date" class="form-control border-success text-success" type="date" name="" id="">
            </div>
            <div class="fw-bold fs-4">
                <label for="">Seat No</label>
               <input id="seat" class="form-control border-success text-success" type="text">
            </div>
            <button id="add" type="submit"  class="btn-outline-success form-control mt-3" onclick="Ticket()">Submit</button>
        </form>
    </div>
       <div class="text-center mt-4 text-success">
            <h1>Available Tickets</h1>
        </div> 
         <div class="col-lg-6 col-md-4 col-sm-6 mx-auto mt-3">
         <table class="table gap-2  shadow-lg">
            <thead>
            <tr>
               <th>S/N</th>
               <th>First Name</th>
               <th>Second Name</th>
               <th>Date</th>
               <th>Seat No</th>
            </tr>
            </thead>
            <tbody id="display"></tbody>
         </table>
         </div>

    <script src="./assticket.js"></script>
</body>
</html>
