<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
     <div class="container">
        <div class="mt-5 col=lg-7 col-md-6 col-sm-5 mx-auto text-primary">
            <form class="border border-primary rounded px-3 py-5 col-lg-7 mx-auto" action="">
                <div>
                    <label class="fw-bold" for="">Name:</label>
                    <input id="name" class="form-control" type="text">
                    <div id="nameW"></div>
                </div>
                <div>
                    <label class="fw-bold mt-3" for="">email:</label>
                    <input id="email" class="form-control" type="text">
                    <div id="emailW"></div>
                </div>
                <div>
                    <label class="fw-bold mt-3" type="text">Phone No:</label>
                        <input onchange="phoneCheck()" class="form-control" type="text" name="" id="phone">
                        <div id="phoneW"></div>
                </div>
                <div>
                    <label class="fw-bold" for="">Password:</label>
                    <input id="password" class="form-control" type="password">
                </div>
                <div id="passwordW"></div>
                <div>
                    <label class="fw-bold mt-3" for="">confirm password:</label>
                    <input id="con" class="form-control " type="password">
                </div>
                <div id="conPasswordW"></div>
                <div>
                    <button  onclick="submitForm()" type="button" class="btn btn-outline-primary form-control mt-3">Submit</button>
                </div>
            </form>
        </div>
     </div>



     <div>
        <button onclick="fetchComment()">Fetch</button>
     </div>

     <script src="./regex.js"></script>
</body>
</html>
