<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mx-automt-5">
   <div class="text-center text-primary ">
<h1>Weather Forecast</h1>
<div class="flex justify-content-center align-items-center">
<input class="border-primary" type="text" name="" id="city" placeholder="Enter a city name">
<div id="display"></div>
<button onclick="getWeather()" class="btn btn-primary btn-sm mt-3 rounded">Enter</button>
</div>
   </div>
    </div>
    <div id="bg" class="mt-4 container border border-warning p-3 rounded"><div>
         <div class="text-warning text-center">
            <h3 id="main"></h3>
            <h3 id="desc"></h3>
         </div>
        <div class="text-warning d-flex justify-content-around mt-5">
             <h3>Temp: <span id="temp"></span></h3>
             <h3>Humidity: <span id="hum"></span></h3>
        </div>
     <div class="text-warning d-flex justify-content-around mt-5 mb-5">
             <h3>Pressure: <span id="press"></span></h3>
             <h3>Wind speed: <span id="wind"></span></h3>
        </div>
     


    <script src="./weather.js"></script>
</body>
</html>
