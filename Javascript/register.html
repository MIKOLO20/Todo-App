<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</head>
<body>
    <div>
         <input id="query" class="border-info" placeholder="Enter search a user" type="text">
         <button onclick="searchUser()" class="btn btn-info text-light" data-bs-toggle="modal" data-bs-target="#myModal" type="button">Search</button>
    </div>

<!-- The Modal -->
<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">found users</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal body -->
      <div id="body" class="modal-body">
        </div>

      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>
    <div class="container mt-5">
    <div class="container col-sm-6 col-md-8 col-lg-8 mx-auto text-info">   
     <form class="border border-info rounded text-info mt-5 p-3" action="">
        <h1 class="text-center">User Registration</h1>
  <div class="mb-3">
    <label class="fw-medium" for=""> First Name:</label>
    <input id="firstname" class="form-control border-info" placeholder="Enter your name" type="text">
  </div>
    <div class="mb-3">
    <label class="fw-medium" for="">Last Name:</label>
    <input id="lastname" class="form-control border-info" placeholder="Enter your name" type="text">
  </div>
  <div class="mb-3">
    <label class="fw-medium" for="">Email:</label>
    <input id="email" class="form-control border-info" placeholder="Enter your email" type="text">
  </div>
   <div class="mb-3">
    <label class="fw-medium" for="">Address:</label>
    <input id="address" class="form-control border-info" placeholder="Enter your address" type="text">
  </div>
  <div>
    <button class="btn btn-outline-info form-control"  type="button" onclick="registerUser()">Submit</button>
  </div>
 </form>
 <div id="display"></div>
   </div>
    </div>
   <script src="./register.js"></script>
</body>
</html>
