<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    .parent{
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 250px);
        grid-template-rows: repeat(4, 450px);
        justify-content: center;padding: 0 0 70px 0;gap: 15px;
    }
    .child{
        border: 1px solid blue;
        border-radius: 15px;
        font-size: medium;
    }
    .child img{
        width: 100%;
        height: 40%;
        border-radius: 20px;
    }
    .child p{
        margin-left: 10px;
        max-height: 200px !important;
    }
</style>
<body>
    <div class="container mx-auto mt-5">
     <div>
        <h2 class="text-warning fw-bolder text-center">Mikolo Movie</h2>
        <div class="text-center mb-5">
            <input type="text" id="search" class="border-primary" placeholder="Enter movie name">
           <span id="btn"> <button id="normal" onclick="fetchMovie()" class="btn btn-primary mx-auto">search</button></span>
        </div>
        <div  class="parent" id="display"></div>
        <div class="text-center mb-5">
            <button onclick="fetchMovie(1)"   class="btn btn-primary btn-sm" id="pg1">1</button>            
            <button onclick="fetchMovie(2)"  class="btn btn-primary btn-sm" id="pg2">2</button>        
        <button onclick="fetchMovie(3)"  class="btn btn-primary btn-sm" id="pg3">3</button>
            <span class="text-primary">....</span>
             <button onclick="fetchMovie(`next`)" id="next" class="btn btn-primary btn-sm">Next</button></butto>
             <button onclick="fetchMovie(`prev`)" id="prev" class="btn btn-primary btn-sm">Prev</button>
        </div>
     </div>
    </div>

    



    <script src="./movie.js"></script>
</body>
</html>
