<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div username="Mikky" class="bca" id="abc">
        <h1>I am ABC</h1>
    </div>
     <div username="babe" class="bca" id="abc">
        <h1>I am 123</h1>
    </div>
    <input  type="text" name="" id="input">
    <button id="enter">Enter</button>










    <script>
    document.getElementById("input").addEventListener("blur", (e) =>{
     document.getElementById("input").style.backgroundColor = "green";
    })
//    console.log(e)
//      console.log(e.target.value);
//   let value = e.target.value;
//    alert(value)

   const throwAlert = () =>{
    alert("i have been clicked");
   };
   document.getElementById("enter").addEventListener("click", throwAlert);
  
  
   document.querySelector("#abc").addEventListener("mouseover", (e) =>{
    e.target.style.color = "yellow";
   });

   document.querySelector("#abc").addEventListener("mouseout", (e) =>{
    e.target.style.color = "";
   });
  document.querySelectorAll(".bca")[1].addEventListener("mouseover", (e) =>{
    e.target.style.color = "red";
   });
    document.querySelectorAll(".bca")[1].addEventListener("mouseout", (e) =>{
     e.target.style.color = "";
    });
   console.log(document.querySelectorAll(".bca")[1].getAttribute("username"));

   </script>
</body>
</html>
