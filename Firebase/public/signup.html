<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="mx-auto col-7 rounded-4 shadow p-3 my-4 border">
        <h1>sign up page</h1>
        <input class="form-control mt-3" type="text" name="" id="firstname" placeholder="Enter first name">
          <input class="form-control mt-3" type="text" name="" id="lastname" placeholder="Enter last name">
            <input class="form-control mt-3" type="text" name="" id="email" placeholder="Enter email ">
             <input class="form-control mt-3" type="text" name="" id="password" placeholder="password ">
            <button id="registerUser" class="btn btn-success mt-3 form-control">sign Up</button>
    </div>
   <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyABEZJu3zJXHU-0k5ehc4DGf2uUYeiItQQ",
    authDomain: "my-first-firebase-projec-62f8e.firebaseapp.com",
    projectId: "my-first-firebase-projec-62f8e",
    storageBucket: "my-first-firebase-projec-62f8e.firebasestorage.app",
    messagingSenderId: "103620978938",
    appId: "1:103620978938:web:4cc80b3b9c7ef269964143",
    measurementId: "G-WKCC7ESQ4D"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth();


document.getElementById("registerUser").addEventListener("click", ()=>{
     let firstname = document.getElementById("firstname").value;
        let lastname = document.getElementById("lastname").value;
         let email = document.getElementById("email").value;
          let password = document.getElementById("password").value;

          let userinfo = {
            firstname,lastname,email,password
          }
          console.log(userinfo)
     
          createUserWithEmailAndPassword(auth, email, password)
          .then((user)=>{
            console.log(user)
          }).catch((error)=>{
            console.log(error)
          })
})
   
</script>

</body>
</html>
